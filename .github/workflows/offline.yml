name: offline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
      - name: Install clean offline/API environment
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q wineid tests
      - name: Pyflakes
        run: python -m pyflakes wineid tests
      - name: Offline suite (heavy smoke requires explicit opt-in)
        run: python -m pytest tests -q -rs
  somelie-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-somelie.txt
      - run: python -m pip install -r requirements-somelie.txt
      - run: python -m pip check
      - run: python -m pytest virtual_somelie -q
  windows-ipc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_vision_ipc.py tests/test_mineru_http.py
  checkpoint-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_tz_modules.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run type-check
        working-directory: web
      - run: npm run build
        working-directory: web
